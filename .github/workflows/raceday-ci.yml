name: RaceDay CI

on:
  push:
    branches:
      - main
      - develop
    paths-ignore:
      - '**.md'
      - 'docs/**'
  pull_request:
    types: [opened, synchronize, reopened]
    paths-ignore:
      - '**.md'
      - 'docs/**'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-repository-structure:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Validate required repository structure
        shell: bash
        run: |
          set -euo pipefail

          required_directories=(
            "docs"
            "src"
            "tests"
            ".github/workflows"
          )

          required_files=(
            "docs/RaceDay_ERD.png"
            "docs/RaceDay_API_Endpoint_Plan.md"
            "src/RaceDay_Database.sql"
            "README.md"
            ".gitignore"
          )

          # Check directories
          for directory in "${required_directories[@]}"; do
            if [[ ! -d "$directory" ]]; then
              echo "::error::Required directory is missing: $directory"
              exit 1
            fi
          done

          # Check files (strict case-sensitive)
          for file in "${required_files[@]}"; do
            if [[ ! -f "$file" ]]; then
              echo "::error::Required file is missing: $file"
              exit 1
            fi
          done

          # Optional: Case-insensitive warning (helps developers)
          echo "::notice::Repository structure validation passed successfully."

      # Optional: Propagate a result for downstream jobs
      - name: Set validation output
        id: set-result
        run: echo "status=passed" >> $GITHUB_OUTPUT