name: RaceDay CI

on:
  push:
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  validate-repository-structure:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Validate required repository structure
        shell: bash
        run: |
          set -euo pipefail

          required_directories=(
            "docs"
            "src"
            "tests"
            ".github/workflows"
          )

          required_files=(
            "docs/RaceDay_ERD.png"
            "docs/RaceDay_API_Endpoint_Plan.md"
            "src/RaceDay_Database.sql"
            "README.md"
            ".gitignore"
          )

          for directory in "${required_directories[@]}"; do
            if [[ ! -d "$directory" ]]; then
              echo "ERROR: Required directory is missing: $directory"
              exit 1
            fi
          done

          for file in "${required_files[@]}"; do
            if [[ ! -f "$file" ]]; then
              echo "ERROR: Required file is missing: $file"
              exit 1
            fi
          done

          echo "RaceDay repository structure validation passed."
